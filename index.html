<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('./Gradient-Background-edit-online.webp');
            background-size: cover;
            background-position: center;
            background-repeat: repeat;
        }

        .signup-page {
            background-color: #78e6ab;
            padding: 10px;
            text-align: center;
            width:35%;
            border-radius: 12px;

        }

        button {
            background: linear-gradient(135deg, #0119d2, #0072ff);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease-in-out;
            margin-top: 25px;
        }

        input {
            width: 80%;
            max-width: 320px;
            padding: 12px 20px;
            margin: 10px 0;
            font-size: 15px;
            color: #333333;
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #0072ff;
            box-shadow: 0 0 10px rgba(0, 114, 255, 0.2);
            background-color: #fafafa;
        }

        input::placeholder {
            color: #999999;
            text-transform: capitalize;
        }
    </style>
</head>

<body>
    <div class="signup-page">
        <h1>hello 🤗 sign-up here</h1>
        <input type="text" placeholder="enter your email " name="" id="semail"><br><br>
        <input type="text" placeholder="enter strong password " name="" id="spass"><br><br>
        <input type="text" placeholder="enter recovery email" name="" id="sremail"><br><br>
        <button onclick="signup()">sign-up</button>

    </div>
    <script src="app.js"></script>
</body>

</html>
