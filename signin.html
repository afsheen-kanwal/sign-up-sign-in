<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('./Gradient-Background-edit-online.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 20px;
        }

        .signin-page {
            background-color: #79e0a9;
            padding: 30px 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            font-size: 15px;
            color: #333333;
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #0072ff;
            box-shadow: 0 0 10px rgba(0, 114, 255, 0.2);
            background-color: #fafafa;
        }

        input::placeholder {
            color: #999999;
            text-transform: capitalize;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #0119d2, #0072ff);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease-in-out;
            margin-top: 15px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="signin-page">
        <h1>SIGN-IN 🤗</h1>
        <input id="lemail" type="email" placeholder="Enter your previous email">
        <input id="lpass" type="password" placeholder="Enter your previous password">
        <button onclick="signin()">Sign In</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
